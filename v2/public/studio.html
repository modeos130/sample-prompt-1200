<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOMAN LAB — Sound Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080a0f;
  --bg2: #101117;
  --bg3: #15161f;
  --border: #282a36;
  --accent: #ff4d6d;
  --accent-dim: #c0392b;
  --accent-light: rgba(255,77,109,0.12);
  --accent2: #ff9a3c;
  --cyan: #00e5ff;
  --gold: #d7b56d;
  --dark: #f0f0f8;
  --text: #f0f0f8;
  --muted: #9ca0b4;
  --text3: #666b82;
  --white: #ffffff;
  --font: 'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
}

body {
  background:
    linear-gradient(180deg, rgba(255,77,109,0.04), transparent 280px),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(8,10,15,0.88);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  backdrop-filter: blur(16px);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.logo {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0;
  line-height: 1;
  color: var(--white);
  text-decoration: none;
}
.logo .lab { color: var(--accent); }
.header-badge {
  display: inline-flex;
  align-items: center;
  border: 1px solid rgba(215,181,109,0.32);
  border-radius: 999px;
  padding: 6px 12px;
  color: var(--gold);
  background: rgba(215,181,109,0.08);
  font-family: var(--display);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
  white-space: nowrap;
}
.nav-pill {
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 14px;
  font-family: var(--display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
  text-decoration: none;
  text-transform: uppercase;
  transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
}
.nav-pill:hover {
  color: var(--text);
  border-color: rgba(255,77,109,0.55);
  background: rgba(255,77,109,0.08);
}

/* HERO */
.hero {
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  background:
    linear-gradient(90deg, rgba(255,77,109,0.16), rgba(255,154,60,0.05), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.028) 0, rgba(255,255,255,0.028) 1px, transparent 1px, transparent 7px),
    #0b0c12;
}
.hero-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 52px 24px 34px;
}
.hero-kicker {
  color: var(--gold);
  font-family: var(--display);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-title {
  max-width: 780px;
  margin: 0;
  font-family: var(--display);
  font-size: 64px;
  font-weight: 800;
  letter-spacing: 0;
  line-height: 0.9;
  text-transform: uppercase;
  color: var(--text);
}
.hero-title span {
  color: var(--accent);
}
.hero-sub {
  max-width: 620px;
  font-size: 17px;
  color: var(--muted);
  line-height: 1.6;
  margin-top: 16px;
}
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}
.meta-badge {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 8px 12px;
  color: var(--muted);
  background: rgba(255,255,255,0.035);
  font-size: 13px;
  font-weight: 600;
}
.meta-badge strong {
  color: var(--text);
}
.feature-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
}
.feature-link {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 0 12px;
  color: var(--muted);
  background: rgba(255,255,255,0.035);
  font-family: var(--display);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0;
  text-decoration: none;
  text-transform: uppercase;
}
.feature-link.active {
  color: #0a0a0f;
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

/* CONTAINER */
.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 24px 72px;
}

/* TOOL SWITCH */
.tool-switch {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  max-width: 700px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(16,17,23,0.86);
  margin-bottom: 18px;
}
.tool-button {
  min-height: 42px;
  border: 0;
  border-radius: 7px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  font-family: var(--display);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 150ms ease, background 150ms ease, transform 150ms ease;
}
.tool-button:hover {
  color: var(--text);
  background: rgba(255,255,255,0.045);
}
.tool-link {
  display: flex;
  align-items: center;
  justify-content: center;
}
.tool-button.active {
  color: #0a0a0f;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

/* MODE TABS */
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  max-width: 520px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(16,17,23,0.86);
  margin-bottom: 28px;
}
.mode-tab {
  font-family: var(--display);
  min-height: 42px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  padding: 0 16px;
  color: var(--muted);
  cursor: pointer;
  background: none;
  border: 0;
  border-radius: 7px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.mode-tab:hover { color: var(--text); background: rgba(255,255,255,0.045); }
.mode-tab.active {
  color: #0a0a0f;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

/* SEARCH BAR */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}
.search-input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px 12px 42px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,77,109,0.15); }

/* FILTER TABS */
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--accent-dim) var(--bg2);
}
.filter-row::-webkit-scrollbar { height: 6px; }
.filter-row::-webkit-scrollbar-track { background: var(--bg2); border-radius: 3px; }
.filter-row::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }
.filter-tab {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 7px 14px;
  border-radius: 6px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.filter-tab:hover { color: var(--text); border-color: #3a3a4a; }
.filter-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--white);
}
.filter-count {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}

/* SOUND CARDS */
.cards-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}
.sound-card {
  width: calc(25% - 9px);
  min-width: 180px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
}
.sound-card .card-art {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
}
.sound-card .card-body { padding: 14px; }
.sound-card:hover {
  border-color: #3a3a4a;
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(255,77,109,0.2);
}
.sound-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(255,77,109,0.25);
}
.card-name {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 4px;
}
.card-genre {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.card-vibe {
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* MODEL TOGGLE */
.model-toggle {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  width: fit-content;
}
.model-btn {
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 10px 20px;
  background: var(--bg2);
  color: var(--muted);
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}
.model-btn:hover { color: var(--text); }
.model-btn.active {
  background: var(--accent);
  color: var(--white);
}

/* ACTION BUTTONS */
.btn-surprise {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--accent2);
  border-radius: 10px;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  background: transparent;
  color: var(--accent2);
  margin-top: 10px;
  transition: all 0.2s;
}
.btn-surprise:hover { background: rgba(255,154,60,0.1); }
.btn-surprise:active { transform: scale(0.99); }

.btn-generate {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  font-family: var(--display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  color: var(--white);
  transition: opacity 0.2s, transform 0.1s;
}
.btn-generate:hover:not(:disabled) { opacity: 0.9; }
.btn-generate:active:not(:disabled) { transform: scale(0.99); }
.btn-generate:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* CREATE YOUR OWN TAB */
.genre-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.genre-btn {
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 8px 14px;
  border-radius: 6px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: capitalize;
}
.genre-btn:hover { color: var(--text); border-color: #3a3a4a; }
.genre-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--white);
}

.vibe-textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  resize: vertical;
  min-height: 80px;
  outline: none;
  margin-bottom: 20px;
  transition: border-color 0.2s;
}
.vibe-textarea::placeholder { color: var(--muted); }
.vibe-textarea:focus { border-color: var(--accent-dim); }

/* OUTPUT AREA */
.output-area {
  margin-top: 32px;
  display: none;
}
.output-area.visible { display: block; }

/* LOADING STATE */
.loading-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
}
.waveform {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  height: 40px;
  margin-bottom: 20px;
}
.waveform .bar {
  width: 4px;
  border-radius: 2px;
  background: var(--accent);
  animation: waveform 1.2s ease-in-out infinite;
}
.waveform .bar:nth-child(1) { height: 16px; animation-delay: 0s; }
.waveform .bar:nth-child(2) { height: 28px; animation-delay: 0.15s; }
.waveform .bar:nth-child(3) { height: 36px; animation-delay: 0.3s; }
.waveform .bar:nth-child(4) { height: 24px; animation-delay: 0.45s; }
.waveform .bar:nth-child(5) { height: 20px; animation-delay: 0.6s; }
@keyframes waveform {
  0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
  50% { transform: scaleY(1); opacity: 1; }
}
.loading-text {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.loading-timer {
  font-family: var(--font);
  font-size: 24px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.btn-cancel {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 20px;
  color: var(--muted);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-cancel:hover { border-color: var(--muted); color: var(--text); }

/* SUCCESS STATE */
.result-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
}
.result-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.result-name {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 700;
  color: var(--dark);
}
.result-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid rgba(59,158,255,0.2);
}
.audio-container {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.audio-container audio {
  width: 100%;
  height: 40px;
  outline: none;
}
.btn-download {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--cyan), var(--accent));
  color: var(--bg);
  margin-bottom: 10px;
  transition: opacity 0.2s, transform 0.1s;
}
.btn-download:hover { opacity: 0.9; }
.btn-download:active { transform: scale(0.99); }

.btn-again {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  background: transparent;
  color: var(--text);
  margin-bottom: 12px;
  transition: all 0.2s;
}
.btn-again:hover { border-color: var(--muted); }

.remaining-text {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

/* ERROR STATE */
.error-card {
  background: #1a0f0f;
  border: 1px solid #4a2020;
  border-radius: 12px;
  padding: 28px;
  text-align: center;
}
.error-icon {
  font-size: 32px;
  margin-bottom: 12px;
}
.error-title {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #e05656;
  margin-bottom: 8px;
}
.error-msg {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.5;
}
.btn-retry {
  padding: 10px 28px;
  border: 1px solid #4a2020;
  border-radius: 8px;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  background: transparent;
  color: #e05656;
  transition: all 0.2s;
}
.btn-retry:hover { background: rgba(224,86,86,0.1); }

/* HIDDEN */
.hidden { display: none !important; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .header {
    align-items: flex-start;
    flex-direction: column;
    padding: 14px 16px;
  }
  .header-left {
    width: 100%;
    flex-wrap: wrap;
  }
  .logo { font-size: 18px; }
  .header-badge { display: none; }
  .hero-inner { padding: 38px 16px 28px; }
  .hero-title { font-size: 42px; }
  .hero-sub { font-size: 15px; }
  .container { padding: 18px 16px 54px; }
  .tool-switch { max-width: none; }
  .mode-tab { padding: 12px 16px; font-size: 12px; }
  .sound-card { width: calc(50% - 6px); min-width: 0; }
  .cards-grid { gap: 10px; }
  .result-card { padding: 20px; }
}
@media (max-width: 480px) {
  .sound-card { width: 100%; }
  .tool-switch,
  .mode-tabs { grid-template-columns: 1fr; }
  .mode-tab { padding: 10px 12px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <a href="/home" class="logo">BOOMAN <span class="lab">LAB</span></a>
    <a href="/admin/invite" class="nav-pill">Invite</a>
    <a href="/account" class="nav-pill">Account</a>
  </div>
  <div class="header-badge">Sound Studio</div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-kicker">Sample Prompt 1200</div>
    <h1 class="hero-title">Sound <span>Studio</span></h1>
    <div class="hero-sub">Select a proven sound card and generate a source-style audio idea.</div>
    <div class="feature-nav" aria-label="Tool navigation">
      <a class="feature-link active" href="/studio.html">Sound Studio</a>
      <a class="feature-link" href="/prompts">Prompt Library</a>
      <a class="feature-link" href="/analyze">Sample Analysis</a>
      <a class="feature-link" href="/create.html">Create Your Own</a>
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

  <!-- SOUND LIBRARY -->
  <div id="tab-library">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search sounds...">
    </div>

    <div class="filter-row" id="filterRow"></div>
    <div class="filter-count" id="filterCount"></div>
    <div class="cards-grid" id="cardsGrid"></div>

    <div class="model-toggle" id="modelToggle1">
      <button class="model-btn active" data-model="clip">Preview (30s)</button>
      <button class="model-btn" data-model="pro">Full Track</button>
    </div>

    <button class="btn-generate" id="btnGenLib" disabled>GENERATE</button>
    <button class="btn-surprise" id="btnSurprise">&#127922; SURPRISE ME</button>
  </div>

  <!-- OUTPUT AREA -->
  <div class="output-area" id="outputArea">
    <!-- Loading state -->
    <div class="loading-card" id="stateLoading" class="hidden">
      <div class="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="loading-text">Generating your sound...</div>

// ===== STATE =====

let timerInterval = null;

// ===== DOM REFS =====
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const searchInput = $('#searchInput');
const filterRow = $('#filterRow');

const cardsGrid = $('#cardsGrid');
const outputArea = $('#outputArea');

// ===== INIT =====
function init() {
  buildFilterTabs();

// ===== FILTER TABS =====
function buildFilterTabs() {
  const genres = [...new Set(SOUNDS.map(s => s.genre))];
  let html = `<button class="filter-tab active" data-filter="all">All (${SOUNDS.length})</button>`;
  genres.forEach(g => {
    const count = SOUNDS.filter(s => s.genre === g).length;
    const label = g.replace(/-/g, ' ');
    html += `<button class="filter-tab" data-filter="${g}">${label} (${count})</button>`;
  });
  filterRow.innerHTML = html;
}

// ===== RENDER SOUND CARDS =====
function renderCards() {
  const query = searchInput.value.toLowerCase().trim();
  let filtered = SOUNDS;
  if (currentFilter !== 'all') {
    filtered = filtered.filter(s => s.genre === currentFilter);
  }
  if (query) {
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(query) || s.vibe.toLowerCase().includes(query)
    );
  }

  filterCount.textContent = `Showing ${filtered.length} of ${SOUNDS.length}`;

  cardsGrid.innerHTML = filtered.map(s => `
    <div class="sound-card${selectedSound && selectedSound.id === s.id ? ' selected' : ''}"
         data-id="${s.id}" data-genre="${s.genre}" data-name="${s.name}">
      <img class="card-art" src="/art/${s.id}.jpg" alt="${s.name}" loading="lazy">
      <div class="card-body">
        <div class="card-name">${s.name}</div>
        <div class="card-genre">${s.genre.replace(/-/g, ' ')}</div>
        <div class="card-vibe">${s.vibe}</div>
      </div>
    </div>
  `).join('');
}

// ===== UPDATE GENERATE BUTTON STATES =====
function updateGenButtons() {
  btnGenLib.disabled = !selectedSound;
}

// ===== EVENT BINDING =====
function bindEvents() {
  // Search
  searchInput.addEventListener('input', renderCards);

  // Filter tabs (delegated)
  filterRow.addEventListener('click', (e) => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    filterRow.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderCards();
  });

  // Sound card selection (delegated)
  cardsGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.sound-card');
    if (!card) return;
    const id = card.dataset.id;
    selectedSound = SOUNDS.find(s => s.id === id) || null;
    cardsGrid.querySelectorAll('.sound-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    updateGenButtons();
  });

  // Model toggles
  document.querySelectorAll('.model-toggle').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.model-btn');
      if (!btn) return;
      currentModel = btn.dataset.model;
      document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll(`.model-btn[data-model="${currentModel}"]`).forEach(b => b.classList.add('active'));
    });
  });

  // Surprise Me
  $('#btnSurprise').addEventListener('click', () => {
    const rand = SOUNDS[Math.floor(Math.random() * SOUNDS.length)];
    selectedSound = rand;

    // Set filter to all so the card is visible
    currentFilter = 'all';
    filterRow.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    filterRow.querySelector('[data-filter="all"]').classList.add('active');
    searchInput.value = '';
    renderCards();

    // Highlight card
    const card = cardsGrid.querySelector(`[data-id="${rand.id}"]`);
    if (card) {
      cardsGrid.querySelectorAll('.sound-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    updateGenButtons();
    generateMusic({ promptId: rand.id, model: currentModel });
  });

  // Generate (Library)
  btnGenLib.addEventListener('click', () => {
    if (!selectedSound) return;
    generateMusic({ promptId: selectedSound.id, model: currentModel });
  });

  // Cancel
  $('#btnCancel').addEventListener('click', cancelGeneration);

  // Download
  $('#btnDownload').addEventListener('click', downloadAudio);

  // Generate Again
  $('#btnAgain').addEventListener('click', () => {
    if (lastPayload) generateMusic(lastPayload);
  });

  // Retry
  $('#btnRetry').addEventListener('click', () => {
    if (lastPayload) generateMusic(lastPayload);
  });
}

// ===== GENERATE MUSIC =====
async function generateMusic(payload) {
  lastPayload = payload;
  showLoading();
  startTimer();
  abortController = new AbortController();

  try {
    const res = await fetch('/api/generate-music', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: abortController.signal
    });

    const data = await res.json();
    stopTimer();

    if (!res.ok) {
      showError(data.error || 'Something went wrong');
      return;
    }

    if (!data.audio) {
      showError('No audio was generated. Try a different sound or vibe.');
      return;
    }

    showResult(data);
  } catch (err) {
    stopTimer();
    if (err.name === 'AbortError') {
      clearOutput();
      return;
    }
    showError('Network error. Please check your connection.');
  }
}

// ===== CANCEL =====
function cancelGeneration() {
  if (abortController) abortController.abort();
  stopTimer();
  clearOutput();
}

// ===== TIMER =====
function startTimer() {
  let seconds = 0;
  timerDisplay.textContent = '0:00';
  timerInterval = setInterval(() => {
    seconds++;
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;
    timerDisplay.textContent = `${min}:${String(sec).padStart(2, '0')}`;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

// ===== OUTPUT STATES =====
function clearOutput() {
  outputArea.classList.remove('visible');
  stateLoading.classList.add('hidden');
  stateSuccess.classList.add('hidden');
  stateError.classList.add('hidden');
  stopTimer();
}

function showLoading() {
  outputArea.classList.add('visible');
  stateLoading.classList.remove('hidden');
  stateSuccess.classList.add('hidden');
  stateError.classList.add('hidden');
}

function showResult(data) {
  stateLoading.classList.add('hidden');
  stateError.classList.add('hidden');
  stateSuccess.classList.remove('hidden');

  // Determine display name
  let name = 'Custom Sound';
  let badge = currentModel === 'clip' ? '30s Preview' : 'Full Track';

  if (lastPayload.promptId) {
    const sound = SOUNDS.find(s => s.id === lastPayload.promptId);
    if (sound) name = sound.name;
  } else if (lastPayload.genre) {
    const label = lastPayload.genre.replace(/-/g, ' ');
    name = 'Custom \u00b7 ' + label.charAt(0).toUpperCase() + label.slice(1);
  }

  if (data.soundName) name = data.soundName;

  resultName.textContent = name;
  resultBadge.textContent = badge;

  const mimeType = data.mimeType || 'audio/mpeg';
  const audioSrc = `data:${mimeType};base64,${data.audio}`;
  audioPlayer.src = audioSrc;

  currentAudio = {
    base64: data.audio,
    mimeType: mimeType,
    name: name
  };

  if (data.remaining !== undefined) {
    remainingText.textContent = `${data.remaining} generations remaining today`;
    remainingText.style.display = 'block';
  } else {
    remainingText.style.display = 'none';
  }
}

function showError(msg) {
  stateLoading.classList.add('hidden');
  stateSuccess.classList.add('hidden');
  stateError.classList.remove('hidden');
  errorMsg.textContent = msg;
}

// ===== DOWNLOAD =====
function downloadAudio() {
  if (!currentAudio) return;
  const byteChars = atob(currentAudio.base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) {
    byteNumbers[i] = byteChars.charCodeAt(i);
  }
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: currentAudio.mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `130mode-${(currentAudio.name || 'custom').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '')}.mp3`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== BOOT =====
init();

</script>
