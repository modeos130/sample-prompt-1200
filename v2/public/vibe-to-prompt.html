<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #080b10;
  color: #d0d8e4;
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.splash {
  max-width: 900px;
  width: 100%;
  padding: 40px 20px;
  text-align: center;
}

.banner-img {
  width: 100%;
  max-width: 800px;
  border-radius: 16px;
  border: 1px solid #1a2030;
  box-shadow: 0 8px 40px rgba(59,158,255,0.15);
  margin-bottom: 40px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #e0e8f0;
  margin-bottom: 8px;
}
.logo span { color: #3b9eff; }

.tagline {
  font-size: 15px;
  color: #5a6a80;
  margin-bottom: 32px;
  line-height: 1.6;
}

.line {
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, #3b9eff, #00d4ff);
  margin: 0 auto 32px;
}

.status-badge {
  display: inline-block;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #00d4ff;
  border: 1px solid #1a2030;
  padding: 10px 24px;
  border-radius: 40px;
  background: rgba(59,158,255,0.06);
  margin-bottom: 24px;
}

.status-text {
  font-size: 14px;
  color: #3d4d5c;
  line-height: 1.8;
  max-width: 500px;
  margin: 0 auto;
}

.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 16px;
  text-align: center;
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: #3d4d5c;
  text-transform: uppercase;
  border-top: 1px solid #1a2030;
  background: #080b10;
}

</head>
<body>

<div class="splash">
  <img src="/social-banner-final.png" alt="DJ Booman Prompt Lab" class="banner-img">
